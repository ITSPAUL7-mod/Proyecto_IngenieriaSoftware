
# CONFIGURACION DE POSTGRESQL

spring.datasource.url=jdbc:postgresql://localhost:5432/BackIt
spring.datasource.username=postgres
spring.datasource.password=labcom,2015
spring.datasource.driver-class-name=org.postgresql.Driver


# CONFIGURACION DE HIBERNATE/JPA

# update: Crea/actualiza las tablas automatica
spring.jpa.hibernate.ddl-auto=update

# Dialecto de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Muestra el SQL generado en la consola para depurar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true